name: Validate WUI documentation

on:
  push:
    branches: [main]
    paths:
      - 'doc/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'doc/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wui-documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: doc/requirements.txt
      - name: Install documentation builder
        run: python -m pip install -r doc/requirements.txt
      - name: Build both documentation languages strictly
        run: python doc/build.py --output build-docs
      - uses: actions/upload-artifact@v4
        with:
          name: wui-documentation
          path: build-docs/
          if-no-files-found: error
          retention-days: 7
      - name: Publication instructions
        run: |
          echo 'The public documentation is published with the website by intent-garden/wui_site.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Its daily Pages build reads WUI main; dispatch deploy.yml there for an immediate refresh.' >> "$GITHUB_STEP_SUMMARY"
